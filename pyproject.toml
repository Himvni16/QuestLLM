[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "questllm"
version = "0.1.0"
description = "A local-first quiz generation application."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pypdf>=5,<7",
    "streamlit>=1.40,<2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "app.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
